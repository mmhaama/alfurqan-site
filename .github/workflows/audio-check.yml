# Manual diagnostic for the generated Arabic audio (read-only; prints a comparison table in the log).
name: Arabic audio check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/tts/diag.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get install -y ffmpeg >/dev/null || true
          pip install piper-tts==1.8.0 numpy openai-whisper
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ar_JO-kareem-medium.tar.bz2 | tar xj -C /tmp
      - run: python tools/tts/diag.py /tmp/vits-piper-ar_JO-kareem-medium/ar_JO-kareem-medium.onnx

# Temporary read-only check: transcribes some Google recordings with Whisper.
name: Arabic audio check
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y ffmpeg >/dev/null || true
          pip install openai-whisper >/dev/null
      - shell: python
        run: |
          import whisper
          W = ['نَحْلَة','نُور','نُعَاس','نُزْهَة','نِعْنَاع','نِظَّارَة','نِصْف','نِدَاء','قَمَر','بَطَّة','كِتَاب','فَرَاشَة','بُرْتُقَالَة','سُلَحْفَاة','عُصْفُور','هَذِهِ وَرْدَةٌ.','أَنَا أُسَاعِدُ أُمِّي','نَحْنُ نَتَعَلَّمُ العَرَبِيَّةَ']
          def key(t):
              h = 0x811c9dc5
              for b in ' '.join(t.split()).encode(): h = ((h ^ b) * 0x01000193) & 0xffffffff
              return '%08x' % h
          m = whisper.load_model('medium')
          for t in W:
              r = m.transcribe(f'audio/g/{key(t)}.mp3', language='ar', temperature=0, fp16=False)['text'].strip()
              print('RES', t, '->', r, flush=True)

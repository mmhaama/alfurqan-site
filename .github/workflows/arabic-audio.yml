# Makes sure every Arabic word/sentence in the language exercises has a recording (Google Cloud TTS).
# Runs whenever the exercises change; generates only what is missing and commits it to audio/g/.
# Needs the repository secret GOOGLE_TTS_KEY.
name: Arabic audio
on:
  push:
    branches: [main]
    paths: ['lang-data.js', 'lang.js', 'tools/tts/**', '.github/workflows/arabic-audio.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: arabic-audio
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tools
        run: npm install --no-save --no-package-lock jsdom@24
      - name: List every text the exercises can speak
        run: node tools/tts/collect.js /tmp/said.json
      - name: Generate missing recordings
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python3 tools/tts/gen.py /tmp/said.json
      - name: Check nothing is missing
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: if [ -n "$GOOGLE_TTS_KEY" ]; then python3 tools/tts/gen.py /tmp/said.json --check; fi
      - name: Commit
        run: |
          git config user.name "alfurqan-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r -q --ignore-unmatch audio/tts tools/tts/arphon.py tools/tts/diag.py
          git add audio/g
          git diff --cached --quiet || (git commit -m "audio: add missing Arabic recordings" && git pull --rebase -q && git push)

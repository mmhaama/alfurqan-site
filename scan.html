<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f4d3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>الحضور | Al-Furqan</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root{--green:#0f4d3c;--gold:#c9a24a;--paper:#fbf8f1;--line:#e7dfcc;--muted:#5b6b66;--ok:#1f7a4d;--warn:#b26b00;--bad:#a3261b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0b1f19;color:#fff;font-family:"Noto Naskh Arabic","Inter",system-ui,sans-serif;font-size:17px;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--green)}
  header b{font-size:1.1rem}
  .count{font-family:"Inter",sans-serif;font-weight:700;background:var(--gold);color:#1d1a10;border-radius:999px;padding:4px 12px;font-size:.95rem}
  .pending{font-family:"Inter",sans-serif;font-size:.8rem;background:#b26b00;border-radius:999px;padding:3px 10px;margin-inline-start:6px}
  #cam{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .frame div{width:62vmin;height:62vmin;border:3px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
  #result{min-height:96px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;background:#132e26;transition:background .2s}
  #result .name{font-size:1.45rem;font-weight:700;line-height:1.3}
  #result .sub{font-size:.95rem;opacity:.85}
  #result.ok{background:var(--ok)} #result.warn{background:var(--warn)} #result.bad{background:var(--bad)}
  nav{display:flex;gap:8px;padding:10px;background:#0b1f19}
  button{font:inherit;border:0;border-radius:14px;padding:12px 14px;cursor:pointer}
  .primary{background:var(--gold);color:#1d1a10;font-weight:700;flex:1}
  .ghost{background:#1d3d34;color:#fff;flex:1}
  /* roster */
  #roster{position:fixed;inset:0;background:var(--paper);color:#1d2a26;display:none;flex-direction:column;z-index:5}
  #roster.open{display:flex}
  #roster header{color:#fff}
  #q{margin:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit}
  .tabs{display:flex;gap:6px;padding:0 10px 8px}
  .tabs button{background:#ece6d6;color:#1d2a26;padding:6px 12px;font-size:.9rem}
  .tabs button.on{background:var(--green);color:#fff}
  #list{flex:1;overflow:auto;padding:0 10px 20px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .row small{color:var(--muted)}
  .row button{padding:8px 14px;font-size:.9rem;min-width:92px}
  .row .in{background:var(--ok);color:#fff}
  .row .out{background:#ece6d6;color:#1d2a26}
  /* sign in */
  #login{position:fixed;inset:0;background:var(--paper);color:#1d2a26;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:9}
  #login.hidden{display:none}
  #login h1{color:var(--green);margin:0}
  .err{color:var(--bad)}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="login">
  <h1>تسجيل الحضور</h1>
  <p>أكاديمية الفرقان — للمعلمين فقط.<br>سجّل الدخول بحساب Google المصرّح له.</p>
  <div id="gbtn"></div>
  <p class="err" id="loginErr"></p>
</div>

<header>
  <b>الحضور <span id="today" style="font-family:Inter;font-weight:400;font-size:.85rem"></span></b>
  <span><span class="count" id="count">0</span><span class="pending hidden" id="pending"></span></span>
</header>

<div id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame"><div></div></div>
</div>

<div id="result"><div class="name">وجّه الكاميرا نحو رمز الطالب</div><div class="sub">يُسجَّل الحضور تلقائياً عند قراءة الرمز</div></div>

<nav>
  <button class="ghost" id="rosterBtn" type="button">قائمة الطلاب</button>
  <button class="primary hidden" id="startBtn" type="button">تشغيل الكاميرا</button>
</nav>

<div id="roster">
  <header><b>قائمة الطلاب</b><button class="ghost" id="closeRoster" type="button" style="flex:0">إغلاق</button></header>
  <input id="q" type="search" placeholder="ابحث بالاسم…" autocomplete="off">
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
var CLIENT_ID = '245259754538-snhtq8dl043apofpnsg1c9ihnlsmslh8.apps.googleusercontent.com';
var API_URL   = 'https://script.google.com/macros/s/AKfycbz0SWv9GEW0fZg3ZYK_D5MAnx4cjc0Y8_Wfx_EydxjNKcKvpnCTUqCKw-IbWif-uOg/exec';

var token = null, students = [], byQr = {}, present = {}, group = 'all';
var queue = load('afQueue') || [];          // scans waiting for network
var lastCode = '', lastAt = 0, busy = false;
function $(id){ return document.getElementById(id); }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function normQr(q){ return String(q||'').toUpperCase().replace(/^AF[-:]/,'').replace(/[^A-Z0-9]/g,''); }

/* ---------- feedback ---------- */
var actx;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value = ok ? 880 : 220; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.25);
    o.start(); o.stop(actx.currentTime+.25);
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [60,60,60]);
}
function show(kind, name, sub){
  var r=$('result'); r.className=kind;
  r.innerHTML='<div class="name">'+esc(name)+'</div><div class="sub">'+esc(sub||'')+'</div>';
}
function updateCount(){
  $('count').textContent = Object.keys(present).length;
  $('pending').textContent = queue.length ? ('بانتظار الإرسال: '+queue.length) : '';
  $('pending').classList.toggle('hidden', !queue.length);
}

/* ---------- API ---------- */
function api(payload){
  payload.idToken = token;
  return fetch(API_URL,{method:'POST',body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .catch(function(){ return {ok:false,error:'network'}; });
}
function handleAuthError(d){
  if (d.error==='session_expired' || d.error==='bad_token' || d.error==='not_signed_in'){
    token = null; try{ sessionStorage.removeItem('tTok'); }catch(e){}
    if (window.google && google.accounts) google.accounts.id.prompt();   // silent re-login when possible
    return true;
  }
  if (d.error==='not_teacher'){
    token = null; $('login').classList.remove('hidden');
    $('loginErr').textContent = 'هذا الحساب غير مصرّح له باستخدام صفحة الحضور.';
    return true;
  }
  return false;
}

function loadRoster(){
  return api({action:'roster'}).then(function(d){
    if (!d.ok){ if(!handleAuthError(d) && d.error==='network') useCachedRoster(); return; }
    students = d.students; present = {};
    d.students.forEach(function(s){ if (s.present) present[s.num]=1; });
    queue.forEach(function(q){ var s=findStudent(q); if (s) present[s.num]=1; });
    save('afRoster',{date:d.date,students:students});
    indexRoster(); updateCount(); renderList();
  });
}
function useCachedRoster(){
  var c = load('afRoster'); if (!c) return;
  students = c.students; present = {};
  if (c.date === todayStr()) students.forEach(function(s){ if (s.present) present[s.num]=1; });
  queue.forEach(function(q){ var s=findStudent(q); if (s) present[s.num]=1; });
  indexRoster(); updateCount(); renderList();
}
function indexRoster(){ byQr={}; students.forEach(function(s){ if (s.qr) byQr[s.qr]=s; }); }
function findStudent(item){ return item.qr ? byQr[normQr(item.qr)] : students.filter(function(s){return s.num===item.num;})[0]; }

/* ---------- record ---------- */
function record(item){ // item = {qr} or {num}
  item.at = item.at || Date.now();
  var s = findStudent(item);
  if (item.qr && students.length && !s){ beep(false); show('bad','رمز غير معروف', item.qr); return; }
  if (s && present[s.num]){ beep(true); show('warn', s.name, 'مسجّل حاضراً من قبل اليوم'); return; }
  if (s){ present[s.num]=1; updateCount(); renderList(); beep(true); show('ok', s.name, 'تم تسجيل الحضور ✓  ·  المجموعة '+(s.group||'–')); }
  send(item, s);
}
function send(item, s){
  if (!token){ enqueue(item); return; }
  api({action:item.qr?'scan':'mark', qr:item.qr, num:item.num, at:item.at}).then(function(d){
    if (d.ok){
      if (!s){ present[d.num]=1; beep(true); show(d.status==='already'?'warn':'ok', d.name, d.status==='already'?'مسجّل حاضراً من قبل اليوم':'تم تسجيل الحضور ✓'); }
      updateCount(); renderList(); return;
    }
    if (d.error==='unknown_code'){ if (s){ delete present[s.num]; updateCount(); renderList(); } beep(false); show('bad','رمز غير معروف',''); return; }
    handleAuthError(d);
    enqueue(item);   // network or auth problem → keep and retry
  });
}
function enqueue(item){
  if (!queue.some(function(q){ return q.at===item.at; })){ queue.push(item); save('afQueue',queue); }
  updateCount();
}
function flush(){
  if (!token || !queue.length || busy) return;
  busy = true;
  var item = queue[0];
  api({action:item.qr?'scan':'mark', qr:item.qr, num:item.num, at:item.at}).then(function(d){
    busy = false;
    if (d.ok || d.error==='unknown_code'){ queue.shift(); save('afQueue',queue); updateCount(); if (queue.length) flush(); }
    else handleAuthError(d);
  });
}
setInterval(flush, 10000);
window.addEventListener('online', flush);

/* ---------- camera ---------- */
var video=$('video'), canvas=$('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true}), detector=null;
if ('BarcodeDetector' in window){ try{ detector = new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
function startCamera(){
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false})
    .then(function(stream){ video.srcObject=stream; video.play(); $('startBtn').classList.add('hidden'); requestAnimationFrame(tick); })
    .catch(function(){ $('startBtn').classList.remove('hidden'); show('bad','لا يمكن تشغيل الكاميرا','اسمح للمتصفح باستخدام الكاميرا ثم اضغط «تشغيل الكاميرا»'); });
}
var lastScan = 0;
function tick(t){
  requestAnimationFrame(tick);
  if (t - lastScan < 180 || video.readyState < 2 || $('roster').classList.contains('open')) return;
  lastScan = t;
  if (detector){
    detector.detect(video).then(function(codes){ if (codes[0]) onCode(codes[0].rawValue); }).catch(function(){});
    return;
  }
  var w = 480, h = Math.round(video.videoHeight * w / video.videoWidth) || 360;
  canvas.width=w; canvas.height=h; ctx.drawImage(video,0,0,w,h);
  var code = window.jsQR && jsQR(ctx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:'dontInvert'});
  if (code) onCode(code.data);
}
function onCode(raw){
  var q = normQr(raw); if (!q) return;
  var now = Date.now();
  if (q === lastCode && now - lastAt < 4000) return;   // same sticker held in view
  lastCode = q; lastAt = now;
  record({qr:q});
}
$('startBtn').addEventListener('click', startCamera);

/* ---------- roster (manual) ---------- */
function renderList(){
  if (!$('roster').classList.contains('open')) return;
  var q = $('q').value.trim().toLowerCase();
  var groups = {}; students.forEach(function(s){ groups[s.group||'–']=1; });
  $('tabs').innerHTML = ['all'].concat(Object.keys(groups).sort()).map(function(g){
    return '<button type="button" data-g="'+esc(g)+'" class="'+(g===group?'on':'')+'">'+(g==='all'?'الكل':'المجموعة '+esc(g))+'</button>';
  }).join('');
  var rows = students.filter(function(s){
    return (group==='all' || (s.group||'–')===group) && (!q || s.name.toLowerCase().indexOf(q)>=0);
  }).sort(function(a,b){ return a.name.localeCompare(b.name); });
  $('list').innerHTML = rows.map(function(s){
    var on = !!present[s.num];
    return '<div class="row"><div><b>'+esc(s.name)+'</b><br><small>المجموعة '+esc(s.group||'–')+'</small></div>'+
      '<button type="button" data-n="'+esc(s.num)+'" class="'+(on?'in':'out')+'">'+(on?'حاضر ✓':'تسجيل حضور')+'</button></div>';
  }).join('') || '<p style="text-align:center;color:#5b6b66">لا توجد نتائج</p>';
}
$('tabs').addEventListener('click', function(e){ var g=e.target.getAttribute('data-g'); if (g){ group=g; renderList(); } });
$('list').addEventListener('click', function(e){
  var n = e.target.getAttribute('data-n'); if (!n) return;
  if (present[n]){
    if (!confirm('إلغاء تسجيل حضور هذا الطالب اليوم؟')) return;
    delete present[n]; updateCount(); renderList();
    api({action:'unmark', num:n}).then(function(d){ if (!d.ok){ handleAuthError(d); } });
  } else {
    record({num:n});
  }
});
$('q').addEventListener('input', renderList);
$('rosterBtn').addEventListener('click', function(){ $('roster').classList.add('open'); renderList(); $('q').focus(); });
$('closeRoster').addEventListener('click', function(){ $('roster').classList.remove('open'); $('q').value=''; });

/* ---------- sign in ---------- */
function onCredential(resp){
  token = resp.credential;
  try{ sessionStorage.setItem('tTok', token); }catch(e){}
  $('login').classList.add('hidden'); $('loginErr').textContent='';
  loadRoster().then(flush);
}
(function init(){
  $('today').textContent = new Date().toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
  useCachedRoster(); updateCount();
  try{ token = sessionStorage.getItem('tTok'); }catch(e){}
  if (token){ $('login').classList.add('hidden'); loadRoster().then(flush); }
  startCamera();
  (function waitGsi(){
    if (!(window.google && google.accounts && google.accounts.id)) return setTimeout(waitGsi,150);
    google.accounts.id.initialize({client_id:CLIENT_ID, callback:onCredential, auto_select:true});
    google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',shape:'pill'});
    if (!token) google.accounts.id.prompt();
  })();
  // ID tokens last one hour: refresh silently every 50 minutes during a lesson
  setInterval(function(){ if (window.google && google.accounts) google.accounts.id.prompt(); }, 50*60*1000);
})();
</script>
</body>
</html>

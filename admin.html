<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة | Al-Furqan Academie</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--green:#0f4d3c;--green-2:#14654f;--gold:#c9a24a;--gold-soft:#f3e7c6;--ink:#1d2a26;--muted:#5b6b66;
    --paper:#fbf8f1;--line:#e7dfcc;--ok:#1f7a4d;--ok-bg:#e3f3ea;--bad:#a3261b;--bad-bg:#f8e4e1;--warn:#9a5b00;--warn-bg:#fbefd9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Naskh Arabic","Inter",system-ui,sans-serif;font-size:16px;line-height:1.6}
  .wrap{max-width:1280px;margin:0 auto;padding:0 16px}
  header{border-bottom:1px solid var(--line);background:#fff}
  .bar{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--green)}
  .brand svg{width:32px;height:32px}.brand b{font-family:"Amiri",serif;font-size:1.2rem}
  .pill{border:1px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:5px 12px;font:600 .82rem "Inter",sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
  h1{font-family:"Amiri",serif;color:var(--green);font-size:1.8rem;margin:20px 0 2px}
  .muted{color:var(--muted);font-size:.88rem}
  .hidden{display:none!important}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
  .tile b{display:block;font:700 1.6rem "Inter",sans-serif;color:var(--green)}
  .tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
  .tools input,.tools select{font:inherit;font-size:.92rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
  .tools input{min-width:200px;flex:1}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.9rem}
  th{background:#f4efe2;color:var(--muted);font-weight:600;font-size:.8rem;text-align:start;padding:9px 8px;cursor:pointer;white-space:nowrap;position:sticky;top:0}
  td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
  tr:hover td{background:#fbfaf5}
  .nm b{display:block}.nm span{font-size:.78rem;color:var(--muted);font-family:Inter,sans-serif}
  .em{font-family:Inter,sans-serif;font-size:.8rem;direction:ltr;text-align:left;word-break:break-all}
  .em.none{color:var(--warn);font-family:inherit;direction:rtl;text-align:start}
  .pay{display:flex;gap:4px;flex-wrap:wrap}
  .pm{border-radius:8px;padding:1px 7px;font-size:.78rem;font-weight:700;white-space:nowrap}
  .pm.y{background:var(--ok-bg);color:var(--ok)} .pm.n{background:var(--bad-bg);color:var(--bad)}
  .bar3{height:6px;background:#eee;border-radius:9px;overflow:hidden;margin-top:3px;width:90px}
  .bar3 i{display:block;height:100%;background:#2bb673}
  .num{font-family:Inter,sans-serif;white-space:nowrap}
  .act{display:flex;gap:4px;flex-wrap:wrap}
  .wa{border:0;border-radius:999px;padding:4px 9px;font-size:.8rem;cursor:pointer;background:#e6f6ec;color:#147a43;white-space:nowrap;text-decoration:none;display:inline-block}
  .wa.pay{background:var(--bad-bg);color:var(--bad)} .wa.code{background:var(--warn-bg);color:var(--warn)} .wa.enc{background:#e8f0fb;color:#2b5aa0}
  .stale{color:var(--bad)} .fresh{color:var(--ok)}
  #gbtn{min-height:44px;margin-top:8px}
  .msg.err{color:var(--bad)}
  @media(max-width:820px){
    table,thead,tbody,tr,td{display:block;width:100%} thead{display:none}
    tr{border-top:1px solid var(--line);padding:8px 4px} td{border:0;padding:3px 6px}
    td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:.78rem}
  }
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="/"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3l6 14 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#0f4d3c"/><circle cx="24" cy="23" r="6.5" fill="#c9a24a"/></svg><b>أكاديمية الفرقان</b></a>
  <span style="display:flex;gap:6px"><a class="pill" href="/teacher.html">📚 الدروس</a><a class="pill" href="/scan.html">📷 الحضور</a><button class="pill" id="csvBtn" type="button">⬇ CSV</button></span>
</div></header>

<main class="wrap">
  <h1>لوحة الإدارة</h1>
  <div class="muted" id="sub">كل الطلاب في مكان واحد: الدفع والتدريب والحضور والتواصل.</div>

  <section class="card" id="signin">
    <b>تسجيل الدخول</b>
    <p class="muted">هذه الصفحة لمدير الأكاديمية فقط.</p>
    <div id="gbtn"></div>
  </section>
  <div class="msg err" id="err"></div>

  <section id="app" class="hidden">
    <div class="tiles" id="tiles"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="🔍 ابحث بالاسم أو البريد أو الرمز">
      <select id="grp"><option value="">كل المجموعات</option><option value="1">المجموعة 1</option><option value="2">المجموعة 2</option><option value="-">بلا مجموعة</option></select>
      <button class="chip" data-f="unpaid" type="button">💰 لم يدفع هذا الشهر</button>
      <button class="chip" data-f="nolink" type="button">🔑 لم يسجّل في البوابة</button>
      <button class="chip" data-f="idle" type="button">😴 لم يتدرب منذ 7 أيام</button>
      <span class="muted" id="count"></span>
    </div>
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="muted">أزرار واتساب تفتح المحادثة ورسالة جاهزة باسم الطفل؛ راجعها ثم أرسلها بنفسك.</p>
  </section>
</main>

<script>
var CLIENT_ID='245259754538-snhtq8dl043apofpnsg1c9ihnlsmslh8.apps.googleusercontent.com';
var API_URL='https://script.google.com/macros/s/AKfycbz0SWv9GEW0fZg3ZYK_D5MAnx4cjc0Y8_Wfx_EydxjNKcKvpnCTUqCKw-IbWif-uOg/exec';
var MN={Sep:'سبتمبر',Okt:'أكتوبر',Nov:'نوفمبر',Dec:'ديسمبر',Jan:'يناير',Feb:'فبراير',Mrt:'مارس',Apr:'أبريل',Mei:'مايو',Jun:'يونيو'};
var MNL={Sep:'september',Okt:'oktober',Nov:'november',Dec:'december',Jan:'januari',Feb:'februari',Mrt:'maart',Apr:'april',Mei:'mei',Jun:'juni'};
var token=null, sess=null, D=null, filt={}, sortKey='num', sortDir=1;
try{ sess=localStorage.getItem('sess'); }catch(e){}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(p){ if(sess)p.session=sess; else p.idToken=token;
  return fetch(API_URL,{method:'POST',body:JSON.stringify(p)}).then(function(r){return r.json()})
    .then(function(d){ if(d&&d.session){sess=d.session;try{localStorage.setItem('sess',sess)}catch(e){}} return d; })
    .catch(function(){return {ok:false,error:'network'}}); }
function daysAgo(d){ if(!d) return 9999; return Math.round((new Date(D.today)-new Date(d))/864e5); }
function lastTxt(d){ var n=daysAgo(d); if(n>=9999) return '—'; return n===0?'اليوم':n===1?'أمس':'قبل '+n+' يوم'; }
function first(n){ return String(n).split(/\s+/)[0]; }
function unpaidNow(s){ return D.current ? !s.pay[s.pay.length-1] : false; }

/* ---------- WhatsApp templates ---------- */
function wa(s, kind){
  var f=first(s.name), m=D.current||D.months[D.months.length-1], t='';
  if(kind==='pay') t='السلام عليكم ورحمة الله،\nتذكير لطيف بدفع اشتراك شهر '+MN[m]+' للطالب '+f+' في أكاديمية الفرقان. جزاكم الله خيراً 🌷\n\nVriendelijke herinnering: de bijdrage voor '+MNL[m]+' voor '+f+' staat nog open. Alvast bedankt!';
  else if(kind==='code') t='السلام عليكم ورحمة الله،\nتابعوا واجبات '+f+' ونتائجه وحضوره في بوابة أولياء الأمور:\nhttps://alfurqanacademie.nl/portal.html\nرمز عائلتكم: '+s.code+'\nسجّلوا الدخول بحساب Google ثم أدخلوا الرمز وتاريخ ميلاد الطفل.\n\nOuderportaal: https://alfurqanacademie.nl/portal.html — uw gezinscode: '+s.code;
  else if(kind==='enc') t='السلام عليكم ورحمة الله،\nنشتاق لتدريب '+f+' 🌟 درس هذا الأسبوع والتلاوة موجودان في البوابة، ويكفي 10 دقائق يومياً للاستماع والتكرار:\nhttps://alfurqanacademie.nl/portal.html\n\nWe missen het oefenen van '+f+'! De les en recitatie van deze week staan in het ouderportaal.';
  return 'https://wa.me/'+s.phone+(t?'?text='+encodeURIComponent(t):'');
}

/* ---------- table ---------- */
var COLS=[
  {k:'num',t:'#'},{k:'name',t:'الطالب'},{k:'group',t:'المجموعة'},{k:'email',t:'بريد ولي الأمر'},
  {k:'pay',t:'الدفع'},{k:'week',t:'التدريب'},{k:'last',t:'آخر دخول'},{k:'att',t:'الحضور / الواجب'},{k:'wa',t:'واتساب'}];
function val(s,k){
  if(k==='num') return +s.num||0; if(k==='name') return s.name.toLowerCase(); if(k==='group') return s.group||'z';
  if(k==='email') return s.emails.length?0:1; if(k==='pay') return s.pay.filter(Boolean).length;
  if(k==='week') return s.weekMin; if(k==='last') return -daysAgo(s.last); if(k==='att') return s.att.total?s.att.attended/s.att.total:-1; return 0;
}
function render(){
  var q=$('q').value.trim().toLowerCase(), g=$('grp').value;
  var list=D.students.filter(function(s){
    if(q && (s.name+' '+s.emails.join(' ')+' '+s.code+' '+s.num).toLowerCase().indexOf(q)<0) return false;
    if(g==='-' ? s.group : (g && s.group!==g)) return false;
    if(filt.unpaid && !unpaidNow(s)) return false;
    if(filt.nolink && s.emails.length) return false;
    if(filt.idle && daysAgo(s.last)<7) return false;
    return true;
  }).sort(function(a,b){ var x=val(a,sortKey), y=val(b,sortKey); return (x<y?-1:x>y?1:0)*sortDir; });
  $('count').textContent=list.length+' طالب';
  $('thead').innerHTML=COLS.map(function(c){return '<th data-k="'+c.k+'">'+c.t+(sortKey===c.k?(sortDir>0?' ▲':' ▼'):'')+'</th>'}).join('');
  $('rows').innerHTML=list.map(function(s){
    var pay=D.months.map(function(m,i){return '<span class="pm '+(s.pay[i]?'y':'n')+'">'+(s.pay[i]?'✓ ':'✗ ')+MN[m]+'</span>'}).join('');
    var pct=Math.min(100,Math.round(s.weekMin*100/(s.goalMin||20)));
    var la=daysAgo(s.last);
    var btns='<a class="wa" target="_blank" rel="noopener" href="'+wa(s)+'" title="محادثة">💬</a>'+
      (unpaidNow(s)?'<a class="wa pay" target="_blank" rel="noopener" href="'+wa(s,'pay')+'">💰 تذكير</a>':'')+
      (!s.emails.length&&s.code?'<a class="wa code" target="_blank" rel="noopener" href="'+wa(s,'code')+'">🔑 الرمز</a>':'')+
      (s.emails.length&&la>=7?'<a class="wa enc" target="_blank" rel="noopener" href="'+wa(s,'enc')+'">🎧 تشجيع</a>':'');
    return '<tr>'+
      '<td class="num" data-l="#">'+esc(s.num)+'</td>'+
      '<td class="nm" data-l="الطالب"><b>'+esc(s.name)+'</b><span>'+esc(s.code)+'</span></td>'+
      '<td data-l="المجموعة">'+(s.group?esc(s.group):'<span class="stale">—</span>')+'</td>'+
      '<td data-l="البريد">'+(s.emails.length?'<div class="em">'+s.emails.map(esc).join('<br>')+'</div>':'<div class="em none">لم يسجّل بعد</div>')+'</td>'+
      '<td data-l="الدفع"><div class="pay">'+pay+'</div>'+(s.payNote?'<div class="muted" style="font-size:.75rem">'+esc(s.payNote)+'</div>':'')+'</td>'+
      '<td data-l="التدريب"><span class="num">'+s.weekMin+' / '+s.goalMin+' د</span> <span class="muted">هذا الأسبوع</span><div class="bar3"><i style="width:'+pct+'%"></i></div><span class="muted" style="font-size:.75rem">الشهر: '+s.monthMin+' د · الكل: '+s.totalMin+' د</span></td>'+
      '<td data-l="آخر دخول" class="'+(la<=3?'fresh':la>=7&&la<9999?'stale':'')+'">'+lastTxt(s.last)+'</td>'+
      '<td data-l="الحضور / الواجب"><span class="num">'+(s.att.total?s.att.attended+'/'+s.att.total:'—')+'</span> <span class="muted">حضور</span><br><span class="num">'+s.hwDone+'/'+s.hwTotal+'</span> <span class="muted">واجب</span></td>'+
      '<td data-l="واتساب"><div class="act">'+(s.phone?btns:'<span class="muted">لا يوجد رقم</span>')+'</div></td></tr>';
  }).join('');
}
function tiles(){
  var st=D.students, fam={}, famAll={};
  st.forEach(function(s){ famAll[s.code||s.num]=1; if(s.emails.length) fam[s.code||s.num]=1; });
  var unpaid=st.filter(unpaidNow).length, idle=st.filter(function(s){return daysAgo(s.last)>=7}).length;
  var avg=st.length?Math.round(st.reduce(function(a,s){return a+s.weekMin},0)/st.length):0;
  $('tiles').innerHTML=
    '<div class="tile"><span class="muted">الطلاب</span><b>'+st.length+'</b></div>'+
    '<div class="tile" data-t="nolink"><span class="muted">عائلات سجّلت في البوابة</span><b>'+Object.keys(fam).length+' / '+Object.keys(famAll).length+'</b></div>'+
    '<div class="tile bad" data-t="unpaid"><span class="muted">لم يدفع '+(D.current?MN[D.current]:'')+'</span><b>'+unpaid+'</b></div>'+
    '<div class="tile warn" data-t="idle"><span class="muted">لم يتدرب منذ 7 أيام</span><b>'+idle+'</b></div>'+
    '<div class="tile"><span class="muted">متوسط التدريب هذا الأسبوع</span><b>'+avg+' د</b></div>';
}
function setFilter(f){ filt[f]=!filt[f]; [].forEach.call(document.querySelectorAll('.chip'),function(c){c.classList.toggle('on',!!filt[c.dataset.f])}); render(); }

document.addEventListener('click',function(e){
  var th=e.target.closest('th[data-k]'); if(th&&th.dataset.k!=='wa'){ if(sortKey===th.dataset.k) sortDir=-sortDir; else {sortKey=th.dataset.k; sortDir=1;} render(); return; }
  var c=e.target.closest('.chip[data-f]'); if(c){ setFilter(c.dataset.f); return; }
  var t=e.target.closest('.tile[data-t]'); if(t){ setFilter(t.dataset.t); return; }
});
$('q').addEventListener('input',render); $('grp').addEventListener('change',render);
$('csvBtn').addEventListener('click',function(){
  if(!D) return;
  var head=['#','Name','Groep','Parent Email','WhatsApp'].concat(D.months.map(function(m){return 'Paid '+m})).concat(['Practice week (min)','Practice month (min)','Practice total (min)','Last active','Attendance','Homework done','Family code']);
  var rows=D.students.map(function(s){return [s.num,s.name,s.group,s.emails.join(' '),s.phone?'https://wa.me/'+s.phone:''].concat(s.pay.map(function(p){return p?'yes':'no'})).concat([s.weekMin,s.monthMin,s.totalMin,s.last,s.att.attended+'/'+s.att.total,s.hwDone+'/'+s.hwTotal,s.code])});
  var csv='﻿'+[head].concat(rows).map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='alfurqan-students-'+D.today+'.csv'; a.click();
});

function load(){
  $('sub').textContent='جارٍ التحميل…';
  api({action:'admin'}).then(function(d){
    if(!d.ok){
      $('sub').textContent='';
      if(d.error==='not_admin'){ $('err').textContent='هذا الحساب ليس حساب مدير الأكاديمية.'; return; }
      if(d.error==='session_expired'||d.error==='bad_token'){ signOut(); return; }
      $('err').textContent='حدث خطأ: '+d.error; return;
    }
    D=d; $('signin').classList.add('hidden'); $('app').classList.remove('hidden');
    $('sub').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'})+' · الأشهر المعروضة: '+d.months.map(function(m){return MN[m]}).join('، ');
    tiles(); render();
  });
}
function signOut(){ token=null; sess=null; try{localStorage.removeItem('sess')}catch(e){} $('app').classList.add('hidden'); $('signin').classList.remove('hidden'); }
function onCredential(r){ token=r.credential; load(); }
(function init(){
  if(sess) { $('signin').classList.add('hidden'); load(); }
  (function waitGsi(){
    if(!(window.google&&google.accounts&&google.accounts.id)) return setTimeout(waitGsi,150);
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential});
    google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',shape:'pill',text:'signin_with'});
  })();
})();
</script>
</body>
</html>
